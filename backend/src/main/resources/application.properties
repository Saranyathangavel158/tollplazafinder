spring.application.name=toll-plaza-finder
geoapify.api.key=${GEOAPIFY_API_KEY:}

# Origins allowed to call /api/** from a browser (comma-separated)
tollplaza.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tollplazafinder.vercel.app}

# Max distance (km) between a toll plaza and the route line for it to count as "on the route"
tollplaza.matching.threshold-km=2.0

# Cache of finished toll plaza lookups, keyed by source+destination PIN code pair.
# Up to 1000 pairs are kept, each for 24 hours.
spring.cache.type=caffeine
spring.cache.cache-names=tollPlazas
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h
